name: Build Nevada Ciherellus TV APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses & Build TV APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          npm install -g cordova
          cordova create app com.bestream.nevadacineplus "NEVADA CINE PLUS"
          cp index.html app/www/index.html
          cd app
          cordova platform add android
          sed -i 's/<application /<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:largeHeap="true" /g' platforms/android/app/src/main/AndroidManifest.xml
          sed -i 's/android.intent.category.LAUNCHER/android.intent.category.LAUNCHER" \/><category android:name="android.intent.category.LEANBACK_LAUNCHER/g' platforms/android/app/src/main/AndroidManifest.xml
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEVADA-CINE-PLUS-TV-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
