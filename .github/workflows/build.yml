name: Build Nevada Cine Plus APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Create Cordova TV Project
        run: |
          npm install -g cordova
          cordova create app com.bestream.nevadacineplus "NEVADA CINE PLUS"
          cp index.html app/www/index.html
          cd app
          cordova platform add android
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' platforms/android/app/src/main/AndroidManifest.xml
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEVADA-CINE-PLUS-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
